[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Скорость COM-порта (для монитора и прошивки)
monitor_speed = 115200
upload_speed = 115200

; ВАЖНО: Включаем Native USB (USB CDC) как основной порт Serial для ESP32-C3
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Фильтры монитора (помогают корректно отображать вывод и декодировать ошибки)
monitor_filters = 
    esp32_exception_decoder
    default